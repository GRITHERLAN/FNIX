<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Estilos -->
    <link rel="stylesheet" href="assets/fonts/fontawesome-free-6.1.2-web/css/all.min.css">
    <link rel="stylesheet" href="assets/fonts/poppins/poppins.css">
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/scroll.css">
    <link rel="stylesheet" href="assets/css/icons.css">
    <title>Portafolio - Nicolas Valencia</title>
</head>

<body>

    <!-- layout principal -->
    <div class="layout">

        <!-- barra lateral (info user) -->
        <aside class="layout__aside">

            <section class="aside__user-info">
                <!-- informacion general usuario -->
                <div class="user-info__general">

                    <div class="user-info__container-image">

                        <img src="assets/img/default-user.png" class="user-info__image" alt="Foto Perfil">
                        <!-- aqui el sombreado -->
                    </div>

                    <h2 class="user-info__name">Nicolas A. Valencia B.</h2>

                    <h4 class="user-info__job">Desarrollador Web</h4>
                </div>
                <!-- menu de navegacion -->
                <nav class="layout__menu">

                    <ul class="menu__list">

                        <li class="menu__option">

                            <a class="menu__link" href="index.html">
                                <i class="fa-solid fa-home menu__icon"></i>
                                <span class="menu__overlay">Home</span>
                            </a>
                        </li>

                        <li class="menu__option">
                            <a class="menu__link" href="sobre-mi.html">
                                <i class="fa-solid fa-user menu__icon"></i>
                                <span class="menu__overlay">Sobre mi</span>
                            </a>
                        </li>

                        <li class="menu__option">
                            <a class="menu__link" href="estudios.html">
                                <i class="fa-solid fa-graduation-cap menu__icon"></i>
                                <span class="menu__overlay">Estudios</span>
                            </a>
                        </li>

                        <li class="menu__option">
                            <a class="menu__link" href="portafolio.html">
                                <i class="fa-solid fa-briefcase menu__icon"></i>
                                <span class="menu__overlay">Portafolio</span>
                            </a>
                        </li>

                        <li class="menu__option">
                            <a class="menu__link" href="contacto.html">
                                <i class="fa-solid fa-envelope menu__icon"></i>
                                <span class="menu__overlay">Contacto</span>
                            </a>
                        </li>

                    </ul>

                </nav>
                <!-- links a redes sociales -->
                <div class="user-info__links">

                    <ul class="links__social">

                        <li class="social__option">
                            <a href="#" class="social__link">
                                <i class="fa-brands fa-youtube social__icon"></i>
                            </a>
                        </li>

                        <li class="social__option">
                            <a href="#" class="social__link">
                                <i class="fa-brands fa-linkedin social__icon"></i>
                            </a>
                        </li>

                        <li class="social__option">
                            <a href="#" class="social__link">
                                <i class="fa-brands fa-instagram social__icon"></i>
                            </a>
                        </li>

                    </ul>

                </div>
                <!-- boton de curriculum -->
                <div class="user-info__buttons">
                    <a href="#" class="user-info__btn">Descargar CV</a>
                </div>
                <!-- pie de pagina -->
                <footer class="user-info__footer">
                    &copy; 2026 Nicolas A. Velencia B.
                </footer>

            </section>

        </aside>

        <!-- contenido principal -->
        <main class="layout__content">

            <section class="content__page content__contact">

                <header class="contact__header">
                    <h2 class="contact__title">Contacto</h2>
                </header>

                <div class="contact__container">
                    <section class="contact__info">
                        <div class="contact__data">
                            <i class="fa-solid fa-location-dot contact__icon"></i>
                            <h2 class="contact__subtitle">Colombia</h2>
                        </div>
                        <div class="contact__data">
                            <i class="fa-solid fa-phone contact__icon"></i>
                            <h2 class="contact__subtitle">32429006009</h2>
                        </div>
                        <div class="contact__data">
                            <i class="fa-solid fa-envelope contact__icon"></i>
                            <h2 class="contact__subtitle">nicovalebla@gmail.com</h2>
                        </div>
                        <div class="contact__data">
                            <i class="fa-solid fa-circle-check contact__icon"></i>
                            <h2 class="contact__subtitle">Desarrollador Web</h2>
                        </div>
                    </section>

                    <section class="contact__form-box">
                        <header class="contact__form-header">
                            <h3 class="form-header__title">¿Como puedo <span class="title__color"> ayudarte?</span></h3>
                        </header>
                        <form class="contact__form">
                            <div class="form__container">
                                <div class="form__left">
                                    <input type="text" class="form__input" name="name" required placeholder="Nombre">
                                    <input type="email" class="form__input" name="email" required placeholder="Email">
                                    <input type="text" class="form__input" name="subject" required placeholder="Asunto">
                                </div>
                                <div class="form__right">
                                    <div class="form__group">
                                        <textarea name="message" id="" class="form__input-text" required
                                            placeholder="Mensaje"></textarea>
                                    </div>
                                </div>
                            </div>
                            <input type="submit" name="button" class="form__button" value="Enviar mensaje">
                        </form>
                    </section>
                </div>

            </section>

        </main>

    </div>

</body>

</html>
