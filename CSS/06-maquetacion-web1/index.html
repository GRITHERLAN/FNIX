<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Estilos -->
    <link rel="stylesheet" href="assets/fonts/fontawesome-free-6.1.2-web/css/all.min.css">
    <link rel="stylesheet" href="assets/fonts/poppins/poppins.css">
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <title>Portafolio - Nicolas Valencia</title>
</head>

<body>

    <!-- layout principal -->
    <div class="layout">

        <!-- barra lateral (info user) -->
        <aside class="layout__aside">

            <section class="aside__user-info">
                <!-- informacion general usuario -->
                <div class="user-info__general">

                    <div class="user-info__container-image">

                        <img src="assets/img/default-user.png" class="user-info__image" alt="Foto Perfil">
                        <!-- aqui el sombreado -->
                    </div>

                    <h2 class="user-info__name">Nicolas A. Valencia B.</h2>

                    <h4 class="user-info__job">Desarrollador Web</h4>
                </div>
                <!-- menu de navegacion -->
                <nav class="layout__menu">

                    <ul class="menu__list">

                        <li class="menu__option">

                            <a class="menu__link" href="index.html">
                                <i class="fa-solid fa-home menu__icon"></i>
                                <span class="menu__overlay">Home</span>
                            </a>
                        </li>

                        <li class="menu__option">
                            <a class="menu__link" href="sobre-mi.html">
                                <i class="fa-solid fa-user menu__icon"></i>
                                <span class="menu__overlay">Sobre mi</span>
                            </a>
                        </li>

                        <li class="menu__option">
                            <a class="menu__link" href="estudios.html">
                                <i class="fa-solid fa-graduation-cap menu__icon"></i>
                                <span class="menu__overlay">Estudios</span>
                            </a>
                        </li>

                        <li class="menu__option">
                            <a class="menu__link" href="portafolio.html">
                                <i class="fa-solid fa-briefcase menu__icon"></i>
                                <span class="menu__overlay">Portafolio</span>
                            </a>
                        </li>

                        <li class="menu__option">
                            <a class="menu__link" href="contacto.html">
                                <i class="fa-solid fa-envelope menu__icon"></i>
                                <span class="menu__overlay">Contacto</span>
                            </a>
                        </li>

                    </ul>

                </nav>
                <!-- links a redes sociales -->
                <div class="user-info__links">

                    <ul class="links__social">

                        <li class="social__option">
                            <a href="#" class="social__link">
                                <i class="fa-brands fa-youtube social__icon"></i>
                            </a>
                        </li>

                        <li class="social__option">
                            <a href="#" class="social__link">
                                <i class="fa-brands fa-linkedin social__icon"></i>
                            </a>
                        </li>

                        <li class="social__option">
                            <a href="#" class="social__link">
                                <i class="fa-brands fa-instagram social__icon"></i>
                            </a>
                        </li>

                    </ul>

                </div>
                <!-- boton de curriculum -->
                <div class="user-info__buttons">
                    <a href="#" class="user-info__btn">Descargar CV</a>
                </div>
                <!-- pie de pagina -->
                <footer class="user-info__footer">
                    &copy; 2026 Nicolas A. Velencia B.
                </footer>

            </section>

        </aside>

        <!-- contenido principal -->
        <main class="layout__content">

            <section class="content__page">

                <h1 class="page__name">Nicolas A. Valencia B.</h1>

                <h2 class="page__job">Desarrollador Web</h2>

            </section>

        </main>

    </div>

</body>

</html>
